name: External scheduler (Vercel Hobby cron workaround)

# Vercel Hobby tier only runs native crons once/day (see vercel.json).
# These routes need more frequent calls, so GitHub Actions plays external scheduler.
on:
  schedule:
    - cron: '*/5 * * * *'   # embroidery pickup alerts
    - cron: '*/45 * * * *'  # staff task watch-mode reminders
    - cron: '0 0 * * *'     # CEO daily briefing 8am Manila
    - cron: '0 19 * * 0'    # weekly backup, Monday 3am Manila
    - cron: '0 2 1 * *'     # monthly repo watch
    - cron: '*/30 * * * *'    # improvement scout every 30 min
    - cron: '0 1 * * 1'     # weekly forecast + pricing advice, Monday 9am Manila
    - cron: '30 1 * * 1'    # weekly AI consultant report, Monday 9:30am Manila
    - cron: '0 10 * * *'    # payroll: Saturday sewers, 1st/16th employees (6pm Manila); also the 6pm content slot
    - cron: '0 1 * * *'     # content slot 9:00 AM Manila
    - cron: '0 3 * * *'     # content slot 11:00 AM Manila
    - cron: '30 5 * * *'    # content slot 1:30 PM Manila
    - cron: '0 7 * * *'     # content slot 3:00 PM Manila
    - cron: '0 13 * * *'    # content slot 9:00 PM Manila
    - cron: '0 17 * * *'    # content slot 1:00 AM Manila
    - cron: '0 19 * * *'    # content slot 3:00 AM Manila
    - cron: '0 22 * * *'    # content slot 6:00 AM Manila
    - cron: '30 1 * * *'    # CEO boost advisor 9:30 AM Manila
  workflow_dispatch: {}

jobs:
  embroidery-pickup-alerts:
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call embroidery pickup alerts route
        run: |
          curl -sf -X GET "${{ secrets.APP_BASE_URL }}/api/cron/embroidery-pickup-alerts" \
            -H "Authorization: Bearer ${{ secrets.SCHEDULER_TOKEN }}"

  staff-task-watch:
    if: github.event.schedule == '*/45 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call staff-reminders watch-mode route
        run: |
          curl -sf -X GET "${{ secrets.APP_BASE_URL }}/api/cron/staff-reminders?type=watch" \
            -H "Authorization: Bearer ${{ secrets.SCHEDULER_TOKEN }}"

  retry-queue:
    if: github.event.schedule == '*/45 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Process outbound retry queue
        run: |
          curl -sf -X GET "${{ secrets.APP_BASE_URL }}/api/cron/retry-queue" \
            -H "Authorization: Bearer ${{ secrets.SCHEDULER_TOKEN }}"

  sales-followups:
    if: github.event.schedule == '*/45 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Run sales follow-ups and post-sale outreach
        run: |
          curl -sf -X GET "${{ secrets.APP_BASE_URL }}/api/cron/sales-followups" \
            -H "Authorization: Bearer ${{ secrets.SCHEDULER_TOKEN }}"

  content-publisher:
    if: github.event.schedule == '*/45 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Advance videos and publish due social posts
        run: |
          curl -sf --max-time 120 -X GET "${{ secrets.APP_BASE_URL }}/api/cron/content-publisher" \
            -H "Authorization: Bearer ${{ secrets.SCHEDULER_TOKEN }}"

  watchdog:
    if: github.event.schedule == '*/45 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Uptime and bottleneck watchdog
        run: |
          curl -sf --max-time 60 -X GET "${{ secrets.APP_BASE_URL }}/api/cron/watchdog" \
            -H "Authorization: Bearer ${{ secrets.SCHEDULER_TOKEN }}"

  ceo-digest:
    if: github.event.schedule == '0 0 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Send CEO briefing
        run: |
          curl -sf --max-time 60 -X GET "${{ secrets.APP_BASE_URL }}/api/cron/ceo-digest" \
            -H "Authorization: Bearer ${{ secrets.SCHEDULER_TOKEN }}"

  backup:
    if: github.event.schedule == '0 19 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Weekly database backup
        run: |
          curl -sf --max-time 120 -X GET "${{ secrets.APP_BASE_URL }}/api/cron/backup" \
            -H "Authorization: Bearer ${{ secrets.SCHEDULER_TOKEN }}"

  insights:
    if: github.event.schedule == '0 1 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Weekly forecast and pricing advice
        run: |
          curl -sf --max-time 60 -X GET "${{ secrets.APP_BASE_URL }}/api/cron/insights" \
            -H "Authorization: Bearer ${{ secrets.SCHEDULER_TOKEN }}"

  consultant:
    if: github.event.schedule == '30 1 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Weekly AI consultant report
        run: |
          curl -sf --max-time 60 -X GET "${{ secrets.APP_BASE_URL }}/api/cron/consultant" \
            -H "Authorization: Bearer ${{ secrets.SCHEDULER_TOKEN }}"

  repo-watch:
    if: github.event.schedule == '0 2 1 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Monthly open-source repo watch
        run: |
          curl -sf --max-time 90 -X GET "${{ secrets.APP_BASE_URL }}/api/cron/repo-watch" \
            -H "Authorization: Bearer ${{ secrets.SCHEDULER_TOKEN }}"

  improvement-scout:
    if: github.event.schedule == '*/30 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: GitHub improvement scout (every 30 min)
