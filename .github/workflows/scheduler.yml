  swarm-worker:
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Advance background agent-swarm jobs
        run: |
          curl -sf --max-time 70 -X GET "${{ secrets.APP_BASE_URL }}/api/cron/swarm-worker" \
            -H "Authorization: Bearer ${{ secrets.SCHEDULER_TOKEN }}"

  content-slot-6pm:
